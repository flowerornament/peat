name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      # the toolchain the local gate uses: rust-toolchain.toml, with its
      # components (rustup on the runner reads the file)
      - name: Install the pinned toolchain
        run: |
          rustup toolchain install
          rustc --version
          cargo clippy --version
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Red-capability proof — the ignored oracle twin must FAIL
        run: |
          if cargo test -- --ignored; then
            echo "the red-capable twin PASSED — the retraction oracle is vacuous" >&2
            exit 1
          fi
