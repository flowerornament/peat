name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Red-capability proof — the ignored oracle twin must FAIL
        run: |
          if cargo test -- --ignored; then
            echo "the red-capable twin PASSED — the retraction oracle is vacuous" >&2
            exit 1
          fi
