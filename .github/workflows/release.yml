name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> $GITHUB_ENV
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: tar czf peat-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release peat
      - uses: actions/upload-artifact@v7
        with:
          name: peat-${{ matrix.target }}
          path: peat-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Release notes from CHANGELOG
        run: |
          awk -v tag="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## " tag { on=1; next }
            on && /^## /    { exit }
            on              { print }
          ' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "See CHANGELOG.md" > release-notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: peat-*.tar.gz
          body_path: release-notes.md
      - name: Installer smoke test
        run: |
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          INSTALL_DIR="$tmpdir/bin" bash install.sh --tag "$GITHUB_REF_NAME"
          "$tmpdir/bin/peat" --version
